<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    #unity-container {
      position: absolute;
      width: 100%;
      height: 100%;
      left: 0;
      top: 0;
      background: #{{{ BACKGROUND_COLOR }}};
    }
    #unity-canvas {
      width: 100%;
      height: 100%;
      background: #{{{ BACKGROUND_COLOR }}};
    }
    #unity-loading-bar {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: none;
    }
    #unity-progress-bar-empty {
      width: 200px;
      height: 8px;
      margin-top: 10px;
      background: rgba(255,255,255,0.2);
      border-radius: 4px;
      overflow: hidden;
    }
    #unity-progress-bar-full {
      width: 0%;
      height: 100%;
      background: rgba(255,255,255,0.8);
      border-radius: 4px;
      transition: width 0.1s;
    }
    #unity-footer { position: absolute; bottom: 10px; width: 100%; text-align: center; }

    #info-btn {
      position: fixed; top: 12px; right: 12px; z-index: 10001;
      width: 32px; height: 32px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.5); background: rgba(0,0,0,0.3);
      color: #fff; font: 18px/1 sans-serif; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    #info-btn:hover { background: rgba(0,0,0,0.5); }

    #info-overlay {
      display: none; position: fixed; inset: 0; z-index: 10000;
      background: rgba(0,0,0,0.5); align-items: center; justify-content: center;
    }
    #info-overlay.show { display: flex; }
    #info-modal {
      background: #1a1a1a; color: #eee; max-width: 420px; max-height: 80vh; overflow: auto;
      padding: 20px; border-radius: 8px; position: relative; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    #info-modal h2 { font: 16px/1.3 sans-serif; margin-bottom: 12px; }
    #info-modal p { font: 14px/1.5 sans-serif; margin-bottom: 10px; color: #ccc; }
    #info-close {
      position: absolute; top: 10px; right: 10px;
      width: 28px; height: 28px; border: none; border-radius: 4px;
      background: rgba(255,255,255,0.15); color: #fff; font: 18px/1 sans-serif; cursor: pointer;
    }
    #info-close:hover { background: rgba(255,255,255,0.25); }
  </style>
</head>
<body>
  <button type="button" id="info-btn" aria-label="About">?</button>
  <div id="info-overlay" role="dialog" aria-label="About this project">
    <div id="info-modal">
      <button type="button" id="info-close" aria-label="Close">&times;</button>
      <h2>About LAUTIR</h2>
      <p>This is a daily word experience. You can enter one six-letter word during a short window each day. The project explores time, presence, and ritual.</p>
      <p>Add or edit this text directly in the WebGL template <code>index.html</code> (search for "About LAUTIR").</p>
    </div>
  </div>
  <div id="unity-container">
    <canvas id="unity-canvas"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
  </div>
  <div id="unity-footer">
  </div>
  <script>
    (function() {
      var btn = document.getElementById("info-btn");
      var overlay = document.getElementById("info-overlay");
      var closeBtn = document.getElementById("info-close");
      if (btn) btn.addEventListener("click", function() { overlay.classList.add("show"); });
      if (closeBtn) closeBtn.addEventListener("click", function() { overlay.classList.remove("show"); });
      if (overlay) overlay.addEventListener("click", function(e) { if (e.target === overlay) overlay.classList.remove("show"); });
    })();
    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
        memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: "{{{ COMPANY_NAME }}}",
        //productName: "{{{ PRODUCT_NAME }}}",
        //productVersion: "{{{ PRODUCT_VERSION }}}",
      }, function (progress) {
        var progressBarFull = document.querySelector("#unity-progress-bar-full");
        progressBarFull.style.width = 100 * progress + "%";
      }).then(function (unityInstance) {
        document.querySelector("#unity-loading-bar").style.display = "none";
      }).catch(function (message) {
        alert(message);
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
