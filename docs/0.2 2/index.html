<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>New Unity Project</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    #unity-container {
      position: absolute;
      width: 100%;
      height: 100%;
      left: 0;
      top: 0;
      background: ##1F1F20;
    }
    #unity-canvas {
      width: 100%;
      height: 100%;
      background: ##1F1F20;
    }
    #unity-loading-bar {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: none;
    }
    #unity-progress-bar-empty {
      width: 200px;
      height: 8px;
      margin-top: 10px;
      background: rgba(255,255,255,0.2);
      border-radius: 4px;
      overflow: hidden;
    }
    #unity-progress-bar-full {
      width: 0%;
      height: 100%;
      background: rgba(255,255,255,0.8);
      border-radius: 4px;
      transition: width 0.1s;
    }
    #unity-footer { position: absolute; bottom: 10px; width: 100%; text-align: center; }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
  </div>
  <div id="unity-footer">
    <p style="font-family: sans-serif; font-size: 12px; color: #888;">New Unity Project v1.0</p>
  </div>
  <script>
    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/0.2.loader.js";
    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: buildUrl + "/0.2.data",
        frameworkUrl: buildUrl + "/0.2.framework.js",
        codeUrl: buildUrl + "/0.2.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "New Unity Project",
        productVersion: "1.0",
      }, function (progress) {
        var progressBarFull = document.querySelector("#unity-progress-bar-full");
        progressBarFull.style.width = 100 * progress + "%";
      }).then(function (unityInstance) {
        document.querySelector("#unity-loading-bar").style.display = "none";
      }).catch(function (message) {
        alert(message);
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
